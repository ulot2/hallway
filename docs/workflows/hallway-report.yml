# TEMPLATE: copy into .github/workflows/ of the repository you want reviewed.
# It lives here, not in this repo's .github/workflows, because this repo has no
# root Storybook to review; its own CI exercises Hallway against example/ instead.
#
# Phase 2 of 2. Holds the Jev key, never checks out or runs pull request code.
#
# `workflow_run` runs from the default branch with access to secrets. It reads only the
# JSON artifact produced by phase 1, so a malicious pull request has no path to the key.

name: Hallway (report)

on:
  workflow_run:
    workflows: ['Hallway (extract)']
    types: [completed]

permissions:
  contents: read
  actions: read          # download the artifact from the extract run
  pull-requests: write
  checks: write

jobs:
  report:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Download state from the untrusted job
        uses: actions/download-artifact@v4
        with:
          name: hallway-state
          path: .hallway
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Pin to a release tag once one exists.
      - uses: ulot2/hallway@main
        with:
          mode: review
          jev-api-key: ${{ secrets.JEV_API_KEY }}
          set-check: 'true'
