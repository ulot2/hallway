name: Release

# Push a full version tag (v1.2.3) to release. This workflow publishes the GitHub
# release and moves the major tag (v1) to it, which is what `uses: ulot2/hallway@v1`
# resolves to.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Never move v1 onto a commit whose tests fail.
      - run: npm ci
      - run: npm test

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"

      - name: Move the major tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major"
          git push -f origin "refs/tags/$major"
