name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Calibration harness smoke test
        run: npm run calibrate -- --demo

  integration:
    # Proves the pipeline still works against a real Storybook build, not just fixtures.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Build the example Storybook
        run: npm install && npm run build-storybook
        working-directory: example
      - name: Review the example end to end
        run: npm run example
